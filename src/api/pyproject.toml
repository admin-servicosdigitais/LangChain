[project]
name = "value-betting-api"
version = "0.1.0"
description = "Value Betting API — FastAPI + Mangum"
requires-python = ">=3.12"
dependencies = [
    "value-betting-shared",
    "fastapi>=0.115",
    "mangum>=0.19",
    "boto3>=1.34",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.7",
]

[tool.uv.sources]
value-betting-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["value_betting_api"]
