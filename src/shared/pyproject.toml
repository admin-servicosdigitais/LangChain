[project]
name = "value-betting-shared"
version = "0.1.0"
description = "Modelos compartilhados e utilitários do Value Betting"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["value_betting_shared"]
