[project]
name = "value-betting"
version = "0.1.0"
description = "Value Betting SaaS — Monorepo"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "src/shared",
    "src/m01_collector",
    "src/api",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto[dynamodb,sqs,s3,ses]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,sqs,cloudwatch]>=1.34",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
